; NOT RUNNABLE. Planning template only; copy only validated Mac .conf settings.
; Android native port may manage this programmatically rather than reading .conf.
; DO NOT boot cloned guest on NetBEUI until its WFW computer name is changed.
; Based on DOSBox-X 2026.08+ syntax; engine/core support must be checked.

[ne2000]
ne2000=true
; Set exactly the same I/O base and IRQ as the installed WFW NIC driver.
; DO NOT assume these sample values match Mac working guest.
nicbase=300
nicirq=10
; Unique locally administered/unicast NIC MAC, check for collisions.
macaddr=02:57:4B:33:11:03
; Requires ETHNET-capable DOSBox-X-derived Android core.
backend=ethnet

[autoexec]
; OFFLINE FIRST BOOT: do NOT connect to Mac until WFW PC name is unique.
; After identity change, concept only: ETHNET CONNECT <MAC_TAILSCALE_IP> <ETHNET_PORT>
; Copy validated Mac guest's drive-mount and boot sequence (and any needed BIOS geom).
; Example only (NOT literal paths):
; IMGMOUNT 2 "/android/app/private/machines/YARDOMOB.raw" -t hdd -fs none
; BOOT C:
