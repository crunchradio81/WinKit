name: WinKit A26 Android ARM64 Diagnostics Build (device unverified)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_API: '28'
      ANDROID_ABI: arm64-v8a
    steps:
      - name: Checkout A26 source (independent development branch)
        uses: actions/checkout@v4
        with:
          ref: android-a26-keyboard-diagnostics
      - name: Verify Android source branch and build entry point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = android-a26-keyboard-diagnostics
          test -f scripts/BUILD_A10_ANDROID.sh
          test -f MANIFEST.sha256
          echo "Compiling source from: $(git rev-parse HEAD) (android-a26-keyboard-diagnostics)"
      - name: Prepare manifest-clean source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$RUNNER_TEMP/winkit-source"
          mkdir -p "$SOURCE_ROOT"
          git archive --format=tar HEAD | tar -xf - -C "$SOURCE_ROOT"
          echo "WINKIT_SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          # The integrity verifier is deliberately strict. Git metadata and
          # build/test logs must remain OUTSIDE this source snapshot.
          python3 "$SOURCE_ROOT/VERIFY_A10.py"
      - name: Verify A26 keyboard diagnostics and launch transitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$WINKIT_SOURCE_ROOT"
          python3 host-tests/a18/test_core_probe_contract.py
          grep -Fq 'WinKit A26: keyboard toggle requested' scripts/apply_a2_overlay.py
          grep -Fq 'WinKit A26: engine joined; returning to launcher' scripts/apply_a2_overlay.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK (current command-line tools)
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Linux and Android prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential cmake ninja-build pkg-config python3 zip unzip curl binutils
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Pin host Kotlin compiler 2.0.21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/winkit-kotlin"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/winkit-kotlin/compiler.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/winkit-kotlin/compiler.zip" -d "$RUNNER_TEMP/winkit-kotlin"
          echo "$RUNNER_TEMP/winkit-kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/winkit-kotlin/kotlinc/bin/kotlinc" -version
          sha256sum "$RUNNER_TEMP/winkit-kotlin/compiler.zip" > "$RUNNER_TEMP/kotlin-compiler-sha256.txt"
      - name: A10 atomic-publish + parity/boot + native/Gradle build attempt
        shell: bash
        run: |
          set -euo pipefail
          cd "$WINKIT_SOURCE_ROOT"
          bash scripts/BUILD_A10_ANDROID.sh 2>&1 | tee "$RUNNER_TEMP/a10-android-build.log"
      - name: Publish A26-named diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$WINKIT_SOURCE_ROOT/_build_outputs"
          test -s "$OUT/WinKit311-Android-A10-debug-DEVICE-UNVERIFIED.apk"
          cp "$OUT/WinKit311-Android-A10-debug-DEVICE-UNVERIFIED.apk" "$OUT/WinKit311-Android-A26-debug-NOT-UPGRADE-SAFE.apk"
          sha256sum "$OUT/WinKit311-Android-A26-debug-NOT-UPGRADE-SAFE.apk" > "$OUT/A26-BUILD-SHA256SUMS.txt"
      - name: Inspect compiled debug APK (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          APK="$WINKIT_SOURCE_ROOT/_build_outputs/WinKit311-Android-A26-debug-NOT-UPGRADE-SAFE.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/winkit-apk-verification.txt"
          "$AAPT2" dump badging "$APK" > "$RUNNER_TEMP/winkit-apk-badging.txt"
          grep -Fq "package: name='org.winkit.android.a2'" "$RUNNER_TEMP/winkit-apk-badging.txt"
          echo "Android debug APK package and signature verification passed."
          echo "WARNING: This APK uses a build-specific debug key, NOT a confirmed update key."
          echo "DO NOT install over or uninstall an existing WinKit app to test this APK."
      - name: Upload diagnostic logs (including failed builds)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinKit311-A26-Android-Build-Logs
          path: |
            ${{ runner.temp }}/a10-android-build.log
            ${{ runner.temp }}/kotlin-compiler-sha256.txt
            ${{ runner.temp }}/winkit-apk-verification.txt
            ${{ runner.temp }}/winkit-apk-badging.txt
            ${{ runner.temp }}/winkit-source/_external/Retro-Dosbox/android/build/tree-arm64-v8a/config.log
            ${{ runner.temp }}/winkit-source/_external/Retro-Dosbox/android/build/arm64-v8a/sdl3-build/CMakeCache.txt
            ${{ runner.temp }}/winkit-source/_external/Retro-Dosbox/android/build/arm64-v8a/sdl3-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/winkit-source/_external/Retro-Dosbox/android/app/build/reports/
            ${{ runner.temp }}/winkit-source/_external/Retro-Dosbox/android/app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload diagnostic APK after package checks (not upgrade-safe)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WinKit311-A26-DEBUG-NOT-UPGRADE-SAFE-DEVICE-UNVERIFIED
          path: |
            ${{ runner.temp }}/winkit-source/_build_outputs/WinKit311-Android-A26-debug-NOT-UPGRADE-SAFE.apk
            ${{ runner.temp }}/winkit-source/_build_outputs/A26-BUILD-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
