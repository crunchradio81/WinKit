name: WinKit A30 Upstream DOSBox-X Source Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a30-upstream-source-audit.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated A30 source-recovery branch
        uses: actions/checkout@v4
        with:
          ref: android-a30-upstream-core-source
      - name: Verify isolated and checksum-locked WinKit source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = android-a30-upstream-core-source
          python3 VERIFY_A10.py
          bash -n scripts/RUN_A30_UPSTREAM_SOURCE_AUDIT.sh
          python3 -m py_compile scripts/a30_audit_upstream_core.py
      - name: Fetch and inspect exact upstream DOSBox-X Git source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/RUN_A30_UPSTREAM_SOURCE_AUDIT.sh "$RUNNER_TEMP/a30-source-audit.json"
          python3 - "$RUNNER_TEMP/a30-source-audit.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["revision"] == "029bd65c5dcc7cdc7f2e14e35278620d9707d969"
          assert report["source_compatibility"] == "NOT-COMPATIBLE-AS-IS"
          assert report["configure_mentions_sdl3"]
          assert not report["retrodos_host_header_present"]
          print("Source audit result:")
          print(json.dumps(report, indent=2))
          PY
      - name: Publish source inventory only (no DOSBox-X or guest binaries)
        uses: actions/upload-artifact@v4
        with:
          name: WinKit-A30-PINNED-UPSTREAM-SOURCE-REPORT-NOT-AN-APK
          path: ${{ runner.temp }}/a30-source-audit.json
          retention-days: 30
          if-no-files-found: error
